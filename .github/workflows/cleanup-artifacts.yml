name: Cleanup artifacts

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ${{ (github.event.pull_request.head.repo.fork && 'ubuntu-latest') || vars.RUNNER || 'ubuntu-latest' }}
    permissions:
      actions: write
    steps:
      - name: Remove artifacts older than 1 day
        uses: c-hive/gha-remove-artifacts@v1.2.0
        with:
          age: '1 day'
