name: Deploy to Sonatype Central

on:
  push:
    branches: [ main ]
    paths:
      - core/src/main/java/**
      - core/pom.xml

  workflow_dispatch:
    inputs:
      commit:
        description: 'Release commit (defaults to the workflow commit)'
        type: string
        required: false
      baseline_version:
        description: 'Previous published version (defaults to latest release)'
        type: string
        required: false

jobs:
  api-compatibility:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    uses: ./.github/workflows/release-api-compatibility.yml
    with:
      candidate-ref: ${{ inputs.commit || github.sha }}
      baseline-version: ${{ inputs.baseline_version || '' }}

  build:
    needs: api-compatibility
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit || github.sha }}
      - name: Set up Maven Central Repository
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - name: Deploy with Maven
        run: cd core && mvn -B clean deploy -Pci-cd
        env:
          MAVEN_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}