name: Move code
on:
  push:
    branches: [ main ]
  pull_request_target:
  workflow_dispatch:
jobs:
  move-code:
    if: github.event_name != 'workflow_dispatch' || (github.repository == 'WMS-DEV/usos4j-internal' && github.ref == 'refs/heads/main')
    runs-on: ${{ (github.event.pull_request.head.repo.fork && 'ubuntu-latest') || vars.RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Make Docker usable on the ARC runner
        run: bash .github/scripts/arc-docker-shim.sh
      - uses: olivr/copybara-action@v1.2.4
        with:
          ssh_key: ${{ secrets.SSH_KEY }}
          access_token: ${{ secrets.GH_TOKEN }}
          workflow: ${{ github.event_name == 'workflow_dispatch' && 'push' || '' }}
          sot_repo: WMS-DEV/usos4j-internal
          destination_repo: WMS-DEV/usos4j
          committer: WMS_BOT <kontakt@wmsdev.pl>
          push_exclude: .github/dependabot.yml
