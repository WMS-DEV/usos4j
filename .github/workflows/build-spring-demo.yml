name: Spring Demo - Build and test

on:
  push:
    branches: [ "main" ]
    paths:
      - spring-demo/**
      - .github/workflows/build-spring-demo.yml
  pull_request:
    branches: [ "main" ]
    types: [ opened, synchronize, reopened, ready_for_review ]
    paths:
      - spring-demo/**
      - .github/workflows/build-spring-demo.yml
  workflow_dispatch:

concurrency:
  group: spring-demo-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  spring-demo:
    if: github.event_name != 'pull_request' || (!github.event.pull_request.draft && !github.event.pull_request.head.repo.fork)
    runs-on: ${{ (github.event.pull_request.head.repo.fork && 'ubuntu-latest') || vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
      - uses: ./.github/actions/setup-maven
      - name: Build Spring Demo with Maven
        run: mvn -B --no-transfer-progress -f spring-demo/pom.xml install
