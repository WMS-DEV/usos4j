name: 'Auto Assign'
on:
  pull_request:
    types: [opened, ready_for_review]

jobs:
  add-reviews:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      AUTHOR: ${{ github.event.pull_request.user.login }}
    steps:
      - name: Request review
        run: |
          reviewer=gniadeck
          if [ "$AUTHOR" = "gniadeck" ]; then reviewer=pszumanski; fi
          gh pr edit ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --add-reviewer "$reviewer"
