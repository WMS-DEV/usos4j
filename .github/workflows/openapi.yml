name: OpenAPI specification

on:
  push:
    branches: [ "main" ]
    paths:
      - core/src/main/java/**
      - openapi/**
      - .github/workflows/openapi.yml
  pull_request:
    branches: [ "main" ]
    paths:
      - core/src/main/java/**
      - openapi/**
      - .github/workflows/openapi.yml
  workflow_dispatch:

jobs:
  build:
    if: github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork
    runs-on: ${{ (github.event.pull_request.head.repo.fork && 'ubuntu-latest') || vars.RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validator
        run: pip install openapi-spec-validator
      - name: Test the generator
        run: python -m unittest discover -s openapi
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Test the OAuth 1.0a signer
        run: node --test openapi/test_oauth1.js
      - name: Generate specification
        run: python openapi/generate_openapi.py build/site/openapi.json
      - name: Validate specification
        run: python -m openapi_spec_validator build/site/openapi.json
      - name: Add Swagger UI page
        run: cp openapi/index.html openapi/oauth1.js build/site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

  deploy:
    needs: build
    if: github.repository == 'WMS-DEV/usos4j' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
